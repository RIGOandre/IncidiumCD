<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos — Indicium Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='graph.css') }}">
</head>
<body>
    <!-- Tela de carregamento: os gráficos chegam por fetch, em base64 -->
    <div id="loading-screen" role="status" aria-live="polite">
        <h2>Carregando Gráficos...</h2>
        <div id="loading-spinner" aria-hidden="true"></div>
    </div>

    <a class="voltar" href="{{ url_for('home') }}">home</a>

    <p id="chart-error" class="chart-error" hidden>
        Não foi possível carregar os gráficos. Verifique o terminal do servidor e recarregue a página.
    </p>

    {% for chart_id, titulo in charts.items() %}
    <section class="chart">
        <h1>{{ titulo }}</h1>
        <img id="{{ chart_id }}" alt="{{ titulo }}">
    </section>
    {% endfor %}

    <script>
        const loadingScreen = document.getElementById('loading-screen');
        const chartError = document.getElementById('chart-error');

        function hideLoadingScreen() {
            loadingScreen.hidden = true;
        }

        fetch('/generate_charts')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Servidor respondeu ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                Object.entries(data).forEach(([id, base64]) => {
                    const img = document.getElementById(id);
                    if (img) {
                        img.src = `data:image/png;base64,${base64}`;
                    }
                });
                hideLoadingScreen();
            })
            .catch(error => {
                console.error('Erro ao carregar gráficos:', error);
                chartError.hidden = false;
                hideLoadingScreen();
            });
    </script>
</body>
</html>
